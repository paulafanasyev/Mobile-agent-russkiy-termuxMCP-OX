plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.firewall'
version = '1.0.0'

android {
  namespace "expo.modules.firewall"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }

  sourceSets {
    main.java.srcDirs += file("../src/main/java")
  }
}

dependencies {
  compileOnly 'com.facebook.react:react-android'
  compileOnly files("../../../build/native/libbox.aar")
}
