name: Проверка русского Android-проекта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверить инструменты
        run: |
          node --version
          pnpm --version

      - name: Установить зависимости (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Проверить конфигурацию
        run: bash scripts/verify-android-agent.sh

      - name: Проверить TypeScript
        run: pnpm exec tsc --noEmit
